name: Build YoPlayer PKG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ps3dev/ps3toolchain:latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Compilar PKG do PS3
        run: |
          ls -la
          chmod +x build.sh
          ./build.sh

      - name: Salvar o PKG pronto
        uses: actions/upload-artifact@v4
        with:
          name: YoPlayer-pkg
          path: YoPlayer.pkg