name: Build YoPlayer PKG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar compilador PowerPC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-powerpc64-linux-gnu python3

      - name: Compilar PKG do PS3
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Salvar o PKG pronto
        uses: actions/upload-artifact@v4
        with:
          name: YoPlayer-pkg
          path: YoPlayer.pkg