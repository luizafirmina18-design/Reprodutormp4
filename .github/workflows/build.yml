name: Compilar PKG

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps3dev/ps3dev:latest
    steps:
      - uses: actions/checkout@v4

      - name: Ver ambiente
        run: |
          echo "PS3DEV=$PS3DEV"
          echo "PSL1GHT=$PSL1GHT"
          ls $PS3DEV

      - name: Compilar
        run: make

      - name: Gerar PKG
        run: make pkg

      - uses: actions/upload-artifact@v4
        with:
          name: app-ps3
          path: "*.pkg"