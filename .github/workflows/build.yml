name: Build YoPlayer PKG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Compilar PKG do PS3
        run: |
          docker run --rm -v ${{ github.workspace }}:/work -w /work ps3dev/ps3toolchain:latest bash build.sh

      - name: Salvar o PKG pronto
        uses: actions/upload-artifact@v4
        with:
          name: YoPlayer-pkg
          path: YoPlayer.pkg